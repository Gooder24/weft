<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Weft: ukážky prvého spustenia</title>
<!-- A clickable mock of the onboarding paths in docs/navrhy/2026-11-onboarding/plan.md. Not the app: no network,
     made-up people and numbers. ?path=<name>&frame=<n> draws one frame; record.cjs turns every path into a GIF.
     Without parameters the page lists the paths and arrows step through them. -->
<style>
@font-face { font-family: 'Departure Mono'; src: url('../../../../app/fonts/DepartureMono-Regular.woff2') format('woff2'); font-display: block; }
:root {
  --font: 'Departure Mono', ui-monospace, monospace; --fs: 11px; --fs-2: 22px; --lh: 14px;
  --radius: 10px; --radius-s: 6px; --radius-l: 14px; --bw: 2px;
  --page: #000a07; --panel: #0a1512; --soft: #1a2320; --hover: #26302c; --line: #26302c; --line-strong: #585f5d;
  --text: #f0f0eb; --muted: #b4b4b0; --accent: #628790; --accent-text: #000a07; --link: #a2cdc4;
  --message: #e5786d; --notice: #a1d289; --warning: #e2c08d; --info: #abe7e6;
}
* { box-sizing: border-box; }
body { margin: 0; font: var(--fs)/var(--lh) var(--font); color: var(--text); background: var(--page); font-synthesis: none; }
#stage { width: 680px; height: 500px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.top { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: var(--bw) solid var(--line); }
.top img { width: 18px; height: 18px; }
.top .path { color: var(--muted); }
.top .dots { margin-left: auto; display: flex; gap: 4px; }
.top .dots i { width: 18px; height: 4px; border-radius: 2px; background: var(--soft); }
.top .dots i.on { background: var(--accent); }
.body { flex: 1; min-height: 0; padding: 18px 28px; display: flex; flex-direction: column; gap: 10px; }
h1 { margin: 0; font-size: var(--fs-2); line-height: 26px; font-weight: 400; }
p { margin: 0; }
.muted { color: var(--muted); }
.ok { color: var(--notice); }
.warn { color: var(--warning); }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; gap: 10px; padding: 9px 12px; border: var(--bw) solid var(--line); border-radius: var(--radius); background: var(--panel); }
.opt .r { flex: none; width: 12px; height: 12px; margin-top: 1px; border: var(--bw) solid var(--line-strong); border-radius: 50%; }
.opt.on { border-color: var(--accent); }
.opt.on .r { border-color: var(--accent); background: radial-gradient(var(--link) 0 3px, transparent 3.5px); }
.opt .t { display: flex; flex-direction: column; gap: 3px; flex: 1; }
.opt .n { display: flex; gap: 8px; }
.opt .n .tag { margin-left: auto; color: var(--link); }
.opt .d { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; }
.foot { margin-top: auto; display: flex; gap: 8px; align-items: center; }
.foot .primary { margin-left: auto; }
.primary { border: 0; border-radius: var(--radius-s); padding: 6px 14px; background: var(--accent); color: var(--accent-text); font: inherit; }
.ghost { border: var(--bw) solid var(--line); border-radius: var(--radius-s); padding: 4px 12px; background: none; color: var(--text); font: inherit; }
.link { color: var(--link); }
code, .code { font: inherit; }
.code { display: block; padding: 10px 12px; border-radius: var(--radius); background: var(--soft); color: var(--info); white-space: pre; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field .in { padding: 6px 10px; border: var(--bw) solid var(--line-strong); border-radius: var(--radius-s); background: var(--panel); min-height: 30px; }
.field .in.focus { border-color: var(--link); }
.caret { display: inline-block; width: 6px; height: 12px; margin-left: 1px; vertical-align: -2px; background: var(--link); }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border: var(--bw) solid var(--line); border-radius: var(--radius); background: var(--panel); }
.tile img { width: 24px; height: 24px; border-radius: var(--radius-s); }
.tile .s { color: var(--muted); }
.tile.done { border-color: var(--notice); }
.tile.done .s { color: var(--notice); }
table { border-collapse: collapse; width: 100%; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td:first-child { color: var(--muted); width: 36%; }
.bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.acct { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: var(--bw) solid var(--line); border-radius: var(--radius); background: var(--panel); }
.acct .row img { width: 18px; height: 18px; border-radius: var(--radius-s); }
.acct .row .ghost { padding: 2px 10px; }
.fake { border: var(--bw) dashed var(--line-strong); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.fake .crumb { color: var(--muted); }
.fake .hl { color: var(--text); outline: var(--bw) solid var(--warning); outline-offset: 2px; border-radius: 2px; }
.check { display: flex; gap: 8px; align-items: center; }
.check b { width: 12px; height: 12px; border: var(--bw) solid var(--line-strong); border-radius: 3px; font-weight: 400; }
.check.on b { border-color: var(--warning); background: var(--warning); }
.check.off { color: var(--muted); }
.drop { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border: var(--bw) dashed var(--line-strong); border-radius: var(--radius-l); }
.drop.over { border-color: var(--link); background: var(--panel); }
.file { display: flex; gap: 10px; padding: 6px 10px; border-radius: var(--radius-s); background: var(--soft); }
.file span:last-child { margin-left: auto; color: var(--muted); }
.qr { width: 132px; height: 132px; padding: 8px; background: #f0f0eb; border-radius: var(--radius-s); display: grid; grid-template-columns: repeat(21, 1fr); }
.qr i { background: #000a07; }
.qr i.w { background: transparent; }
.note { padding: 8px 10px; border-left: var(--bw) solid var(--warning); background: var(--panel); border-radius: 0 var(--radius-s) var(--radius-s) 0; }
.note.info { border-left-color: var(--info); }
.cols { display: flex; gap: 14px; }
.cols > * { flex: 1; }
#ring { position: absolute; pointer-events: none; border: var(--bw) solid var(--warning); border-radius: var(--radius); display: none; }
#cursor { position: absolute; pointer-events: none; display: none; width: 0; height: 0;
  border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 16px solid var(--text);
  transform: rotate(-28deg); transform-origin: top left; }
body.live { display: flex; gap: 24px; padding: 24px; min-height: 100vh; }
body.live #stage { flex: none; border: var(--bw) solid var(--line); border-radius: var(--radius-l); }
body.live [data-id] { cursor: pointer; }
#nav { display: none; width: 230px; flex-direction: column; gap: 8px; }
body.live #nav { display: flex; }
#nav button { text-align: left; }
#nav button.on { border-color: var(--accent); }
#nav .help { color: var(--muted); }
</style>
</head>
<body>
<div id="nav"></div><div id="stage"></div>
<div id="ring"></div><div id="cursor"></div>
<script>
const IMG = '../../../../app/';
const NET = {
  messenger: ['Messenger', 'messenger.ico'], instagram: ['Instagram', 'instagram.png'], whatsapp: ['WhatsApp', 'whatsapp.webp'],
  discord: ['Discord', 'discord.png'], gmail: ['Gmail', 'gmail.ico'], outlook: ['Outlook', 'outlook.png'],
  teams: ['Teams', 'teams.png'], edupage: ['EduPage', 'edupage.png'],
};
const bar_top = (title, n, of) => `<div class="top"><img src="${IMG}icon.svg" alt=""><span>Weft</span><span class="path">· ${title}</span>
  <span class="dots">${Array.from({ length: of }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span></div>`;
const opt = (id, name, desc, on, tag = '') => `<div class="opt${on ? ' on' : ''}" data-id="${id}"><span class="r"></span>
  <span class="t"><span class="n"><span>${name}</span>${tag ? `<span class="tag">${tag}</span>` : ''}</span><span class="d">${desc}</span></span></div>`;
const foot = (next, back = 'Späť', extra = '') => `<div class="foot"><button class="ghost" data-id="back">${back}</button>${extra}<button class="primary" data-id="next">${next}</button></div>`;
const typed = (text, n, focus = true) => `<div class="in${focus ? ' focus' : ''}">${text.slice(0, n)}${focus ? '<span class="caret"></span>' : ''}</div>`;
const tiles = done => `<div class="tiles">${Object.entries(NET).map(([k, [name, img]]) =>
  `<div class="tile${done.includes(k) ? ' done' : ''}" data-id="${k}"><img src="${IMG}${img}" alt=""><span>${name}</span>
  <span class="s">${done.includes(k) ? 'pripojené' : 'Pripojiť'}</span></div>`).join('')}</div>`;
const bar = p => `<div class="bar"><i style="width:${p}%"></i></div>`;
const qr = () => { let s = 7; const cells = [];
  for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) {
    const finder = (a, b) => x >= a && x < a + 7 && y >= b && y < b + 7;
    let dark;
    if (finder(0, 0) || finder(14, 0) || finder(0, 14)) {
      const fx = x % 14 === x ? x : x - 14, fy = y % 14 === y ? y : y - 14;
      const ex = Math.min(fx, 6 - fx), ey = Math.min(fy, 6 - fy), e = Math.min(ex, ey);
      dark = e !== 1;
    } else { s = (s * 1103515245 + 12345) % 2147483648; dark = s % 3 === 0; }
    cells.push(`<i class="${dark ? '' : 'w'}"></i>`);
  }
  return `<div class="qr">${cells.join('')}</div>`; };

// Shared first screen: where the messages will live.
const where = sel => ({ html: `${bar_top('Vitaj', 1, 5)}<div class="body"><h1>Kde budú bežať tvoje správy?</h1>
  <p class="muted">Weft pripojí tvoje siete do jednej schránky. Najprv vyber, kto bude držať server.</p>
  <div class="opts">
  ${opt('self', 'Na mojom vlastnom serveri', 'Starý počítač doma alebo VPS (asi 5 € mesačne). Správy aj prihlásenia máš len ty.', sel === 'self')}
  ${opt('hosted', 'Na serveri, kam ma pozvali', 'Máš pozvánku. Server drží len posledných 30 dní, šifrovane. Celá história je len v tvojom počítači alebo telefóne.', sel === 'hosted')}
  </div>${foot('Pokračovať', 'Späť')}</div>` });

// "How much history" for Messenger and Instagram, before any download.
const metaHistory = sel => ({ html: `${bar_top('Messenger', 2, 6)}<div class="body"><h1>Koľko starej histórie?</h1>
  <p><span class="ok">Messenger je pripojený.</span> <span class="muted">Nové správy chodia hneď. Staré si vyber:</span></p>
  <div class="opts">
  ${opt('new', 'Len nové správy', 'V každom chate ostane posledných 50 správ, ako dnes.', sel === 'new')}
  ${opt('export', 'Všetko cez export z Mety', 'Pár minút klikania podľa návodu, Meta súbor pripraví do pár hodín. Meta ho dáva oficiálne, účet tým neriskuješ.', sel === 'export', 'odporúčané')}
  ${opt('pull', 'Postupne doťahovať v tomto počítači', 'Weft listuje chatmi pomaly za teba, asi deň. Malé riziko, že Meta bude chcieť overenie.', sel === 'pull')}
  </div>${foot('Pokračovať')}</div>` });

const tut = (n, title, body, next = 'Ďalej') => ({ html: `${bar_top('Export z Mety', n, 6)}<div class="body"><h1>${n}/6 · ${title}</h1>${body}${foot(next)}</div>` });

const PATHS = {
  vlastny: { title: 'Vlastný server', frames: [
    { ...where(''), hold: 1500 },
    { ...where(''), click: 'self' },
    { ...where('self'), click: 'next', hold: 700 },
    { html: `${bar_top('Vlastný server', 2, 5)}<div class="body"><h1>Čo budeš potrebovať</h1>
      <div class="opts">
      ${opt('a', 'Počítač, ktorý stále beží', 'Linux, 2 GB RAM, miesto podľa histórie (odhad ti Weft povie pri každej sieti). Starý notebook stačí.', false)}
      ${opt('b', 'Asi 15 minút', 'Inštalátor spraví zvyšok: homeserver, mosty, aktualizácie.', false)}
      ${opt('c', 'Účet Tailscale (zadarmo)', 'K serveru sa dostaneš len ty, z internetu nie je vidieť.', false)}
      </div>${foot('Ukáž mi príkazy')}</div>`, hold: 2600, click: 'next' },
    ...[0, 1, 2].map(k => ({ html: `${bar_top('Vlastný server', 3, 5)}<div class="body"><h1>1 · Nainštaluj Weft na server</h1>
      <p class="muted">Na serveri v termináli:</p>
      <span class="code">git clone https://github.com/Gooder24/weft
cd weft &amp;&amp; ./install.sh</span>
      <p class="muted">Inštalátor sa spýta na Tailscale a vypíše adresu servera. Táto stránka ho nájde sama.</p>
      ${k === 0 ? '<p class="warn">Čakám na server…</p>' : k === 1 ? '<p class="warn">Server odpovedá, kontrolujem mosty…</p>' : '<p class="ok">Server beží: weft.tvoj-tailnet.ts.net · 7 mostov · aktualizácie zapnuté</p>'}
      ${foot('Pokračovať')}</div>`, hold: k === 2 ? 1800 : 1300, click: k === 2 ? 'next' : null })),
    ...[0, 5, 9, 14].map((n, i) => ({ html: `${bar_top('Vlastný server', 4, 5)}<div class="body"><h1>2 · Tvoj účet</h1>
      <div class="field"><span class="muted">Meno</span>${typed('ema', i === 0 ? 0 : 3, i < 2)}</div>
      <div class="field"><span class="muted">Heslo</span>${typed('••••••••••••••', i < 2 ? 0 : n, i >= 2)}</div>
      ${foot('Vytvoriť účet')}</div>`, hold: 350, click: i === 3 ? 'next' : null })),
    { html: `${bar_top('Vlastný server', 5, 5)}<div class="body"><h1>3 · Pripoj siete</h1>
      <p class="muted">Ktorékoľvek, v akomkoľvek poradí. Žiadna nie je povinná, ďalšie pridáš v Nastaveniach → Účty.</p>
      ${tiles([])}<p class="muted">Pri každej sa Weft spýta, koľko starej histórie chceš, a povie, koľko miesta zaberie.</p>
      ${foot('Do schránky', 'Späť')}</div>`, hold: 2200, click: 'messenger' },
    { html: `${bar_top('Messenger', 2, 6)}<div class="body"><h1>Kde má byť história?</h1>
      <p class="muted">Server je tvoj, takže môže byť na ňom. Kópiu v počítači pridáš aj neskôr.</p>
      <div class="opts">
      ${opt('srv', 'Na mojom serveri', 'Vidia ju všetky tvoje zariadenia, vyhľadávanie aj agenti.', true, 'odporúčané')}
      ${opt('both', 'Na serveri aj v tomto počítači', 'Desktopová appka si drží celú kópiu. Funguje aj bez spojenia so serverom.', false)}
      </div><p class="muted">Ďalej: Koľko histórie? (ukážka „Export z Mety“)</p>${foot('Pokračovať')}</div>`, hold: 2400, click: 'next', then: ['export', 0] },
  ] },

  hostovany: { title: 'Pozvánka na cudzí server', frames: [
    { ...where(''), hold: 1200 },
    { ...where(''), click: 'hosted' },
    { ...where('hosted'), click: 'next', hold: 700 },
    ...[0, 4, 9, 14].map((n, i) => ({ html: `${bar_top('Pozvánka', 2, 5)}<div class="body"><h1>Kód pozvánky</h1>
      <div class="field"><span class="muted">Kód z pozvánky</span>${typed('WEFT-7Q4K-M2XD', n)}</div>
      ${i === 3 ? '<p class="ok">Server weft.example · pozvánka platí pre 1 účet · zostáva 3 z 5 miest</p>' : '<p class="muted">Dostal si ho od toho, kto server prevádzkuje.</p>'}
      ${foot('Pokračovať')}</div>`, hold: i === 3 ? 1400 : 350, click: i === 3 ? 'next' : null })),
    { html: `${bar_top('Pozvánka', 3, 5)}<div class="body"><h1>Čo bude na serveri a čo nie</h1>
      <table>
      <tr><td>Prihlásenia do sietí</td><td>na serveri, inak by nechodili nové správy</td></tr>
      <tr><td>Posledných 30 dní správ</td><td>na serveri, šifrované pre tvoje zariadenia. Server ich bez nich neotvorí.</td></tr>
      <tr><td>Celá stará história</td><td><span class="ok">len v tvojom počítači alebo telefóne</span>, server ju neuloží</td></tr>
      <tr><td>Kto server prevádzkuje</td><td>technicky vidí správu vo chvíli, keď prechádza mostom. Ak mu nedôveruješ, zvoľ vlastný server.</td></tr>
      </table>
      <div class="check on" data-id="ok"><b></b><span>Rozumiem</span></div>${foot('Pokračovať')}</div>`, hold: 3400, click: 'next' },
    { html: `${bar_top('Pozvánka', 4, 5)}<div class="body"><h1>Kľúč na obnovenie</h1>
      <p class="muted">Tvoje správy sa šifrujú kľúčom, ktorý server nemá. Keď stratíš všetky zariadenia, otvorí ich len tento kľúč.</p>
      <span class="code">EsTc 8KXp Qm2r Vw7d  Lh4N bZ9s Ty3F uJ6e
Ra1G kP5w Nx8v Dc2Q  mH7j Yt4L sB9f Wq3K</span>
      <div class="row"><button class="ghost" data-id="save">Uložiť do súboru</button><button class="ghost">Skopírovať</button></div>
      <div class="note">Ulož ho mimo Weftu, napríklad do správcu hesiel. Weft ho neukáže druhýkrát.</div>
      ${foot('Mám ho uložený')}</div>`, hold: 2600, click: 'save' },
    { html: `${bar_top('Pozvánka', 5, 5)}<div class="body"><h1>Kde bude celá história?</h1>
      <p class="muted">Server drží len posledných 30 dní. Všetko staršie bude tu:</p>
      <div class="opts">
      ${opt('pc', 'V tomto počítači', 'Desktopová appka · voľné 212 GB', true, 'odporúčané')}
      ${opt('phone', 'V telefóne', 'Appka v telefóne · voľné 18 GB · veľké exporty radšej v počítači', false)}
      ${opt('none', 'Nikde, stačí mi 30 dní', 'Staršie správy sa nebudú sťahovať vôbec.', false)}
      </div>${foot('Pokračovať')}</div>`, hold: 2400, click: 'next' },
    { html: `${bar_top('Pozvánka', 5, 5)}<div class="body"><h1>Pripoj siete</h1>
      <p class="muted">Pri každej sa Weft spýta na históriu a povie, koľko zaberie v tomto počítači.</p>
      ${tiles([])}${foot('Do schránky')}</div>`, hold: 2400 },
  ] },

  export: { title: 'Export z Mety', frames: [
    { ...metaHistory(''), hold: 1800 },
    { ...metaHistory(''), click: 'export' },
    { ...metaHistory('export'), click: 'next', hold: 700 },
    { ...tut(1, 'Otvor stránku Mety', `<p class="muted">Weft otvorí stránku Mety v prehliadači. Prihlasuješ sa tam ty, Weft heslo nevidí.</p>
      <div class="fake"><span class="crumb">Accounts Center › Tvoje informácie a povolenia ›</span><span class="hl">Stiahnuť tvoje informácie</span></div>
      <div class="row"><button class="ghost" data-id="open">Otvoriť stránku Mety</button></div>`), hold: 2400, click: 'open' },
    { ...tut(2, 'Vyber len Správy', `<div class="fake"><span class="crumb">Stiahnuť alebo preniesť › Niektoré tvoje informácie</span>
      <div class="check on"><b></b><span class="hl">Správy</span></div>
      <div class="check off"><b></b><span>Príspevky</span></div><div class="check off"><b></b><span>Komentáre</span></div>
      <div class="check off"><b></b><span>Reklamy a záujmy</span></div><div class="check off"><b></b><span>Poloha</span></div></div>
      <div class="note info">Začiarkni len Správy. Weft nič iné nepotrebuje, a keby v súbore bolo aj niečo iné, nečíta to.</div>`), hold: 3200, click: 'next' },
    { ...tut(3, 'Formát a obdobie', `<div class="fake"><span class="crumb">Stiahnuť do zariadenia</span>
      <span>Obdobie: <span class="hl">Celé obdobie</span></span><span>Formát: <span class="hl">JSON</span></span>
      <span>Kvalita médií: <span class="hl">Vysoká</span> <span class="muted">(Nízka zmenší fotky asi na tretinu)</span></span></div>
      <p class="muted">Potom „Vytvoriť súbory“. Meta pošle upozornenie, keď sú hotové.</p>`), hold: 2800, click: 'next' },
    { ...tut(4, 'Šifrované chaty zvlášť', `<p class="muted">Väčšina chatov na Messengeri je šifrovaná a tie má Meta v inom exporte. Len v počítači:</p>
      <div class="fake"><span class="crumb">messenger.com › Nastavenia › Súkromie a bezpečnosť › Šifrované chaty › Úložisko správ ›</span>
      <span class="hl">Stiahnuť dáta z bezpečného úložiska</span></div>
      <p class="muted">Môže chcieť tvoj PIN k Messengeru. Súbor sa volá messages.zip.</p>`), hold: 3000, click: 'next' },
    { ...tut(5, 'Meta pripravuje súbory', `<p>Zvyčajne do pár hodín, niekedy až 2 dni. Weft medzitým funguje a nové správy chodia.</p>
      <div class="opts">${opt('rem', 'Pripomenúť zajtra o 18:00', 'Ak súbory ešte nebudú, pripomenie znova.', true)}</div>`, 'Hotovo, mám súbory'), hold: 2200, click: 'next' },
    { ...tut(6, 'Pusti sem súbory', `<div class="drop"><span>Pusti sem stiahnuté ZIP súbory</span><span class="muted">alebo</span><button class="ghost">Vybrať súbory</button></div>`, 'Importovať'), hold: 1400 },
    { ...tut(6, 'Pusti sem súbory', `<div class="drop over"><span>facebook-ema-2026-11-25.zip · messages.zip</span></div>`, 'Importovať'), hold: 700 },

function draw(path, i) {
  const f = PATHS[path].frames[i];
  document.getElementById('stage').innerHTML = f.html;
  const ring = document.getElementById('ring'), cursor = document.getElementById('cursor');
  ring.style.display = cursor.style.display = 'none';
  const el = f.click && document.querySelector(`[data-id="${f.click}"]`);
  if (el) {
    const r = el.getBoundingClientRect();
    Object.assign(ring.style, { display: 'block', left: `${r.left + scrollX - 4}px`, top: `${r.top + scrollY - 4}px`, width: `${r.width + 8}px`, height: `${r.height + 8}px` });
    if (!document.body.classList.contains('live')) Object.assign(cursor.style, { display: 'block', left: `${r.left + Math.min(r.width - 10, 40)}px`, top: `${r.top + r.height / 2}px` });
  }
  return { hold: f.hold || (f.click ? 600 : 1000), count: PATHS[path].frames.length };
}
window.PATHS = PATHS; window.draw = draw;

const q = new URLSearchParams(location.search);
if (q.get('path')) draw(q.get('path'), Number(q.get('frame') || 0));
else live();

// The clickable page: the yellow ring shows what to click, choices branch into their path, fields fill themselves.
function live() {
  document.body.classList.add('live');
  // A choice or a network opens its own path: [path, frame].
  const BRANCH = {
    self: ['vlastny', 2], hosted: ['hostovany', 2], export: ['export', 2], pull: ['dotahovanie', 2],
    messenger: ['export', 0], instagram: ['export', 0], whatsapp: ['whatsapp', 0], gmail: ['gmail', 0], outlook: ['gmail', 0],
  };
  const nav = document.getElementById('nav');
  // Not drawn in the mockup: a short note instead of a dead click.
  const NOTE = {
    discord: 'Discord sa pripája ako dnes: okno v desktopovej appke, potom servery v Nastaveniach.',
    teams: 'Teams ako Outlook: stránka Microsoftu, potom rozsah histórie ako pri Gmaile.',
    edupage: 'EduPage: meno a heslo, celý školský rok príde sám (pár MB), bez otázky.',
    new: 'Len nové: nič staré sa nesťahuje, ďalej rovno do schránky.',
  };
  let path = 'vlastny', i = 0, timer = 0, note = '';
  const hist = [];
  const menu = () => {
    nav.innerHTML = `<h1>Ukážky</h1><p class="help">Klikaj na to, čo má žltý rámik, alebo vyber inú možnosť. Polia sa vyplnia samy. ← → listujú.</p>
      ${note ? `<p class="warn">${note}</p>` : ''}<button class="ghost" data-go="start">Od začiatku</button>
      ${Object.entries(PATHS).map(([k, p]) => `<button class="ghost${k === path ? ' on' : ''}" data-go="${k}">${p.title}</button>`).join('')}`;
  };
  // Every step the person takes is remembered, so Späť returns to where they clicked, also across paths.
  const step = (p, k) => { if (PATHS[path].frames[i].click || i === PATHS[path].frames.length - 1) hist.push([path, i]); note = ''; go(p, k); };
  const back = () => { note = ''; hist.length ? go(...hist.pop()) : go('vlastny', 0); };
  const go = (p, k) => {
    clearTimeout(timer);
    path = p; i = Math.max(0, Math.min(k, PATHS[p].frames.length - 1));
    const { hold } = draw(path, i);
    menu();
    const f = PATHS[path].frames[i];
    // Frames nobody clicks in (typing, progress, waiting) move on by themselves.
    if (!f.click && i < PATHS[path].frames.length - 1) timer = setTimeout(() => go(path, i + 1), hold);
  };
  const next = () => {
    const f = PATHS[path].frames[i];
    if (i < PATHS[path].frames.length - 1) step(path, i + 1);
    else if (f.then) step(...f.then);
    else { hist.length = 0; note = ''; go('vlastny', 0); }
  };
  nav.addEventListener('click', e => {
    const b = e.target.closest('[data-go]');
    if (b) { if (b.dataset.go === 'start') { hist.length = 0; note = ''; go('vlastny', 0); } else step(b.dataset.go, 0); }
  });
  document.getElementById('stage').addEventListener('click', e => {
    const el = e.target.closest('[data-id]');
    if (!el) return;
    const id = el.dataset.id, f = PATHS[path].frames[i];
    if (id === 'back') { back(); return; }
    // What the ring marks goes on in this path; another choice or network jumps to its own path.
    if (id === f.click) { next(); return; }
    // On a frame that waits by itself, a click on what the next ring will mark does that click at once.
    for (let k = i; !f.click && k < PATHS[path].frames.length; k++) {
      const later = PATHS[path].frames[k];
      if (later.click === id) { step(path, Math.min(k + 1, PATHS[path].frames.length - 1)); return; }
      if (later.click) break;
    }
    if (BRANCH[id]) { step(...BRANCH[id]); return; }
    if (NOTE[id]) { note = NOTE[id]; menu(); return; }
    if (id === 'next') next();
    else if (!f.click) go(path, i + 1);
    else if (el.classList.contains('opt')) { note = 'V ukážke vedie ďalej označená možnosť. V appke by platila aj táto.'; menu(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') back();
  });
  addEventListener('resize', () => draw(path, i));
  go('vlastny', 0);
}
