# systemd drop-in for matrix-spike-messenger (127.0.0.1:29325) and matrix-spike-instagram (127.0.0.1:29326):
# ~/.config/systemd/user/matrix-spike-<bridge>.service.d/archive.conf. Needs a bridge built with
# messenger-archivefetch.patch (Instagram: instagram-archivefetch.patch); without these variables the patched bridge behaves like the official one.
# A page's photos and videos up to 50 MB go to ARCHIVE_MEDIA_DIR/ARCHIVE_MEDIA_NETWORK (never to Matrix); without
# ARCHIVE_MEDIA_DIR pages stay text only. Instagram: port 29326 and ARCHIVE_MEDIA_NETWORK=instagram.
[Service]
Environment=ARCHIVE_FETCH_ADDR=127.0.0.1:29325
Environment=ARCHIVE_FETCH_TOKEN_FILE=%h/matrix-spike/archive/bridge-token
Environment=ARCHIVE_MEDIA_DIR=%h/matrix-spike/archive/media
Environment=ARCHIVE_MEDIA_NETWORK=messenger
