name: Accessibility barrier
description: Something in Weft is hard or impossible for you to use with a keyboard, a screen reader, zoom or colour.
title: "Accessibility: "
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach screenshots of private chats, mail or calendar entries. You do not have to say why you use assistive technology.
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: Include the steps, and what you expected to happen instead.
    validations:
      required: true
  - type: input
    id: screen
    attributes:
      label: Screen
      description: For example the sign-in form, the inbox, a conversation or the calendar.
  - type: input
    id: environment
    attributes:
      label: Browser or app, with version
  - type: input
    id: assistive-tech
    attributes:
      label: Assistive technology, with version
      description: Leave empty if you use only the keyboard.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Critical: I cannot complete a core task"
        - "Serious: I can complete it only with a lot of difficulty or a workaround"
        - "Moderate: it works, but inconsistently"
        - "Minor: a small effect on the task"
    validations:
      required: true
