name: windows-app

# Weft.exe: the desktop app as a Windows installer for people who are not technical. It installs for the one user
# (no administrator rights), adds Weft to the Start menu and the desktop, and opens the Weft server in the
# repository variable WEFT_SERVER (written into the app as server.json). Each push to main that changes the app
# replaces it in the release "windows", so the link to send stays
# https://github.com/Gooder24/weft/releases/download/windows/Weft-Setup.exe
on:
  pull_request:
    paths: [desktop/**, .github/workflows/windows-app.yml]
  push:
    branches: [main]
    paths: [desktop/**, .github/workflows/windows-app.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: The server the app opens
        if: vars.WEFT_SERVER != ''
        shell: pwsh
        run: '@{ url = "${{ vars.WEFT_SERVER }}" } | ConvertTo-Json | Set-Content -Encoding utf8 server.json'

      - run: npm run dist:win

      - name: The app starts on Windows (hidden self-test of a login window against a page on this machine)
        shell: pwsh
        timeout-minutes: 6
        run: |
          # A page on 127.0.0.1, so the check needs no outside site; two tries of two minutes, never a hung build.
          'ok' | Set-Content index.html
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1' -PassThru -WindowStyle Hidden
          $env:SPRAVY_SELFTEST = '1'
          $env:ELECTRON_ENABLE_LOGGING = '1'
          $env:SPRAVY_SELFTEST_SPEC = @{ url = 'http://127.0.0.1:8765/'; hidden = $true; wait_for_url_pattern = '^http://127\.0\.0\.1:8765/'
            fields = @(@{ id = 'ua'; required = $true; sources = @(@{ type = 'request_header'; name = 'User-Agent'; request_url_regex = '^http://127\.0\.0\.1:8765/' }) }) } | ConvertTo-Json -Depth 6 -Compress
          try {
            foreach ($try in 1, 2) {
              $p = Start-Process dist\win-unpacked\Weft.exe -PassThru -RedirectStandardOutput "selftest-$try.txt" -RedirectStandardError "selftest-$try.err"
              if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; "try ${try}: no answer in 2 minutes" }
              Get-Content "selftest-$try.txt"
              Get-Content "selftest-$try.err" -Tail 40
              if (Select-String -Quiet 'selftest ok' "selftest-$try.txt") { exit 0 }
            }
            throw 'self-test failed'
          } finally { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }

      - uses: actions/upload-artifact@v4
        with:
          name: Weft-Setup
          path: desktop/dist/Weft-Setup.exe

      - name: Replace Weft.exe in the release "windows"
        if: github.event_name == 'push' && vars.WEFT_SERVER != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view windows *> $null
          if ($LASTEXITCODE -ne 0) { gh release create windows --title 'Weft for Windows' --notes 'Download Weft-Setup.exe and open it.' --latest=false }
          gh release upload windows dist/Weft-Setup.exe --clobber
