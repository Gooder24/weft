name: accessibility

# Only pull requests: Karchi's own changes go straight to main and are checked on the machine that made them
# (the commands in README → Tests), so a push to main starts nothing here.
on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Karchi's own pushes and PRs run on asus (github/asus-runner.sh in Karchi-skills.md);
    # a pull request from a fork runs on GitHub's machines.
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'asus' }}
    # A stuck browser must not hold the shared runner for hours (on 2026-11-25 one axe run waited over an hour).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Documentation checks (Testing 5)
        run: python3 .github/scripts/check-docs.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/accessibility/package-lock.json

      - name: Install test dependencies
        working-directory: tests/accessibility
        run: npm ci

      - name: Automated and keyboard checks (Testing 1 and 2)
        working-directory: tests/accessibility
        env:
          CI: "true"
        run: npm test

      - name: The demo runs without a server and asks only 127.0.0.1
        run: node tests/demo/demo.cjs
