name: accessibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Documentation checks (Testing 5)
        run: python3 .github/scripts/check-docs.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/accessibility/package-lock.json

      - name: Install test dependencies
        working-directory: tests/accessibility
        run: npm ci

      - name: Automated and keyboard checks (Testing 1 and 2)
        working-directory: tests/accessibility
        env:
          CI: "true"
        run: npm test
